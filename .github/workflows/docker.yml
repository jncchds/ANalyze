name: Docker image and desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: jncchds/analyze

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ANalyze.Web/ClientApp/package-lock.json

      - name: Check the UI
        working-directory: src/ANalyze.Web/ClientApp
        run: |
          npm ci
          npm run typecheck
          npm run lint

      - name: Run tests
        run: dotnet test tests/ANalyze.Tests/ANalyze.Tests.csproj --configuration Release

  # One native build per platform, no QEMU: under emulation the arm64 runtime stage's apt-get could not resolve
  # ports.ubuntu.com. Each build pushes its image by digest only; docker-merge then tags both as one multi-platform image.
  docker:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      - name: Export the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags the per-platform images as one multi-platform image (latest, the version, sha-…).
  docker-merge:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # Explicit ref check: {{is_default_branch}} depends on the repo setting at run time and skipped "latest" once.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=sha-,format=short

      - name: Create the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

      # Docker Hub's description is the README with its links pointing to GitHub and a link to the repository.
      - name: Prepare the Docker Hub description
        if: github.ref == 'refs/heads/main'
        run: node .github/scripts/dockerhub-readme.mjs README.md > "$RUNNER_TEMP/dockerhub-readme.md"

      # Needs a Docker Hub access token with the "Read, Write, Delete" scope (a "Read & Write" token can push but not edit descriptions).
      - name: Update the Docker Hub description
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: "See what takes space on your drives, find duplicates and clean up safely: web UI, one container."
          readme-filepath: ${{ runner.temp }}/dockerhub-readme.md

  # Electron desktop apps with the server bundled (self-contained .NET). Unsigned: macOS and Windows warn on first start.
  desktop:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            arch: x64,arm64
          # Apple Silicon only.
          - os: macos-latest
            name: mac
            arch: arm64
          # One job per arch: electron-builder would otherwise pack both into one NSIS installer.
          - os: windows-latest
            name: windows-x64
            arch: x64
          - os: windows-latest
            name: windows-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            src/ANalyze.Web/ClientApp/package-lock.json
            desktop/package-lock.json

      - name: Build the app
        working-directory: desktop
        run: |
          npm ci
          node scripts/dist.mjs --arch=${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: ANalyze-${{ matrix.name }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.tar.gz
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          if-no-files-found: error

  # Builds of main publish the apps as the GitHub release v<VERSION>: created (with its tag) the first time a version
  # reaches main, its files replaced by later builds of the same version. Notes come from that version's RELEASE_NOTES.md section.
  release:
    needs: desktop
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      # Only the desktop apps: the run also holds docker/build-push-action's build record (*.dockerbuild), which is not
      # a zip and made the download fail.
      - uses: actions/download-artifact@v4
        with:
          pattern: ANalyze-*
          path: apps
          merge-multiple: true

      - name: Create or update the release
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          # The "## v<version> — date" section, without its heading.
          awk -v h="## $tag " 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' RELEASE_NOTES.md > notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes-file notes.md
            gh release upload "$tag" apps/* --clobber
          else
            gh release create "$tag" apps/* --target "$GITHUB_SHA" --title "ANalyze $version" --notes-file notes.md --latest
          fi
