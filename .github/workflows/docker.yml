name: Docker image and desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: jncchds/analyze

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ANalyze.Web/ClientApp/package-lock.json

      - name: Check the UI
        working-directory: src/ANalyze.Web/ClientApp
        run: |
          npm ci
          npm run typecheck
          npm run lint

      - name: Run tests
        run: dotnet test tests/ANalyze.Tests/ANalyze.Tests.csproj --configuration Release

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      # Only the runtime stage runs emulated; the SPA and .NET stages cross-build natively.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # Explicit ref check: {{is_default_branch}} depends on the repo setting at run time and skipped "latest" once.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub's description is the README with its links pointing to GitHub and a link to the repository.
      - name: Prepare the Docker Hub description
        if: github.ref == 'refs/heads/main'
        run: node .github/scripts/dockerhub-readme.mjs README.md > "$RUNNER_TEMP/dockerhub-readme.md"

      # Needs a Docker Hub access token with the "Read, Write, Delete" scope (a "Read & Write" token can push but not edit descriptions).
      - name: Update the Docker Hub description
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: "See what takes space on your drives, find duplicates and clean up safely: web UI, one container."
          readme-filepath: ${{ runner.temp }}/dockerhub-readme.md

  # Electron desktop apps with the server bundled (self-contained .NET). Unsigned: macOS and Windows warn on first start.
  desktop:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            arch: x64,arm64
          # Apple Silicon only.
          - os: macos-latest
            name: mac
            arch: arm64
          # One job per arch: electron-builder would otherwise pack both into one NSIS installer.
          - os: windows-latest
            name: windows-x64
            arch: x64
          - os: windows-latest
            name: windows-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            src/ANalyze.Web/ClientApp/package-lock.json
            desktop/package-lock.json

      - name: Build the app
        working-directory: desktop
        run: |
          npm ci
          node scripts/dist.mjs --arch=${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: ANalyze-${{ matrix.name }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.tar.gz
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          if-no-files-found: error

  # Builds of main publish the apps as the GitHub release v<VERSION>: created (with its tag) the first time a version
  # reaches main, its files replaced by later builds of the same version. Notes come from that version's RELEASE_NOTES.md section.
  release:
    needs: desktop
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      # Only the desktop apps: the run also holds docker/build-push-action's build record (*.dockerbuild), which is not
      # a zip and made the download fail.
      - uses: actions/download-artifact@v4
        with:
          pattern: ANalyze-*
          path: apps
          merge-multiple: true

      - name: Create or update the release
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          # The "## v<version> — date" section, without its heading.
          awk -v h="## $tag " 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' RELEASE_NOTES.md > notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes-file notes.md
            gh release upload "$tag" apps/* --clobber
          else
            gh release create "$tag" apps/* --target "$GITHUB_SHA" --title "ANalyze $version" --notes-file notes.md --latest
          fi
