name: Docker image and desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: jncchds/analyze

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ANalyze.Web/ClientApp/package-lock.json

      - name: Check the UI
        working-directory: src/ANalyze.Web/ClientApp
        run: |
          npm ci
          npm run typecheck
          npm run lint

      - name: Run tests
        run: dotnet test tests/ANalyze.Tests/ANalyze.Tests.csproj --configuration Release

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      # Only the runtime stage runs emulated; the SPA and .NET stages cross-build natively.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # Explicit ref check: {{is_default_branch}} depends on the repo setting at run time and skipped "latest" once.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Electron desktop apps with the server bundled (self-contained .NET). Unsigned: macOS and Windows warn on first start.
  desktop:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            arch: x64,arm64
          - os: macos-latest
            name: mac
            arch: x64,arm64
          - os: windows-latest
            name: windows
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            src/ANalyze.Web/ClientApp/package-lock.json
            desktop/package-lock.json

      - name: Build the app
        working-directory: desktop
        run: |
          npm ci
          node scripts/dist.mjs --arch=${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: ANalyze-${{ matrix.name }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.tar.gz
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          if-no-files-found: error

  # Version tags (v*) also publish the apps as a GitHub release.
  release:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apps
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: apps/*
          generate_release_notes: true
